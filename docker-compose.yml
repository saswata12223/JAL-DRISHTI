version: '3.8'

services:
  db:
    image: timescale/timescaledb-ha:pg15
    container_name: flashfloodai_postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: flashfloodai
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
